# Neon PostgreSQL (free plan). Credentials are never committed:
#   - `neon init` writes DATABASE_URL / DATABASE_URL_UNPOOLED to .env.local (git-ignored), which
#     NeonEnvironmentPostProcessor converts to the JDBC settings below, or
#   - set DATABASE_URL (jdbc:postgresql://...?sslmode=require), DATABASE_USERNAME and DATABASE_PASSWORD yourself.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Small pool, no idle connections: lets Neon scale compute to zero between uses.
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 600000
      connection-timeout: 20000
      keepalive-time: 0
  thymeleaf:
    cache: true
  flyway:
    # db/vendor/postgresql/V100 is numbered above the shared migrations, so a database that already has V100 must
    # still accept later shared migrations such as V13.
    out-of-order: true

bas:
  # Background jobs pause after 20 minutes without anyone using the app, so an unattended laptop
  # does not spend the free plan's 100 CU-hours per month.
  idle-pause: 20m
  telemetry:
    retention: 3d
    rollup-retention: 90d
  # Worst case about 0.2 GB of the free plan's 1 GB: 100,000 failure-risk rows (about 1.8 KB each, enough for 90 days
  # of 15-minute predictions on 11 machines in constant use) and 50,000 ML-lab rows (about 0.5 KB each).
  predictions:
    retention: 90d
    max-rows: 100000
    ml-retention: 30d
    ml-max-rows: 50000
  simulator:
    enabled: ${BAS_SIMULATOR_ENABLED:true}
    interval: 30s
  # Off unless switched on: every message spends the server's Kiro credits.
  assistant:
    enabled: ${BAS_KIRO_ASSISTANT_ENABLED:false}
  security:
    users:
      - username: ${BAS_ADMIN_USER:admin}
        password: ${BAS_ADMIN_PASSWORD:}
        roles: [ADMIN, ENGINEER, VIEWER]
      - username: ${BAS_ENGINEER_USER:engineer}
        password: ${BAS_ENGINEER_PASSWORD:}
        roles: [ENGINEER, VIEWER]
      - username: ${BAS_REVIEWER_USER:reviewer}
        password: ${BAS_REVIEWER_PASSWORD:}
        roles: [ENGINEER, VIEWER]
      - username: ${BAS_TECHNICIAN_USER:technician}
        password: ${BAS_TECHNICIAN_PASSWORD:}
        roles: [TECHNICIAN, VIEWER]
      - username: ${BAS_VIEWER_USER:viewer}
        password: ${BAS_VIEWER_PASSWORD:}
        roles: [VIEWER]
