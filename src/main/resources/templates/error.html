<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Error')}"></head>
<body>
<main class="container" style="max-width: 640px; margin-top: 10vh;">
    <h1 class="h3" th:text="${status ?: 'Error'}">Error</h1>
    <p th:text="${message ?: error ?: 'Something went wrong.'}">Something went wrong.</p>
    <a th:href="@{/}" class="btn btn-primary">Back to overview</a>
</main>
</body>
</html>
